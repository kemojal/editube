[pytest]
testpaths = tests
python_files = test_*.py
# The suite names classes `SomethingTests`, not `TestSomething`; both are
# collected so neither convention silently disappears.
python_classes = Test* *Tests
python_functions = test_*

# The app is noisy at import: Pydantic v1-style `class Config` blocks and
# SQLAlchemy 1.x `declarative_base()` both warn on every collection. They are
# real debt, but drowning the signal makes failures harder to read.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:.*declarative_base.*:sqlalchemy.exc.MovedIn20Warning

markers =
    postgres: requires a live Postgres (schemas SQLite cannot model)
